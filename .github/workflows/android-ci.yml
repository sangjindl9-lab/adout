name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, lint and build APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Restore release keystore (optional)
        if: ${{ secrets.RELEASE_STORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_STORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "releaseStoreFile=$RUNNER_TEMP/release.jks"
            echo "releaseStorePassword=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "releaseKeyAlias=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "releaseKeyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> gradle.properties

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Build release APK and AAB
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Verify artifacts and checksums
        run: |
          set -e
          ls -l app/build/outputs/apk/debug app/build/outputs/apk/release app/build/outputs/bundle/release
          sha256sum app/build/outputs/apk/debug/*.apk \
                    app/build/outputs/apk/release/*.apk \
                    app/build/outputs/bundle/release/*.aab | tee checksums.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eum-security-pro-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            checksums.txt
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            checksums.txt
